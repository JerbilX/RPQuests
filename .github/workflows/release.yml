name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for auto-versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LuaJIT and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit zip

      - name: Run unit tests
        run: luajit tests/run.lua

      - name: Build clean ESOUI package
        run: ./scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPQuest-zip
          path: dist/RPQuest.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RPQuest.zip
          generate_release_notes: true
