name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Use ESOUI updatetest endpoint instead of live update'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for auto-versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LuaJIT and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit zip

      - name: Run unit tests
        run: luajit tests/run.lua

      - name: Build clean ESOUI package
        run: ./scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPQuest-zip
          path: dist/RPQuest-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RPQuest-*.zip
          generate_release_notes: true

      - name: Publish to ESOUI
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          ESOUI_API_TOKEN: ${{ secrets.ESOUI_API_TOKEN }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "$ESOUI_API_TOKEN" ]; then
            echo "ESOUI_API_TOKEN secret is not set; skipping ESOUI upload."
            exit 0
          fi
          ZIP_PATH=$(ls dist/RPQuest-*.zip | head -n 1)
          VERSION=$(basename "$ZIP_PATH" | sed -E 's/^RPQuest-(.+)\.zip$/\1/')
          : > changelog.txt
          mapfile -t TAGS < <(git tag -l 'v*' --sort=-v:refname --merged HEAD)
          for i in "${!TAGS[@]}"; do
            TAG="${TAGS[$i]}"
            NEXT_IDX=$((i + 1))
            echo "[B]${TAG}[/B]" >> changelog.txt
            if [ "$NEXT_IDX" -lt "${#TAGS[@]}" ]; then
              PREV="${TAGS[$NEXT_IDX]}"
              RAW_LOG=$(git log "${PREV}..${TAG}" --no-merges --pretty=format:"- %s")
            else
              RAW_LOG=$(git log "${TAG}" --no-merges --pretty=format:"- %s")
            fi
            PLAYER_LOG=$(printf '%s\n' "$RAW_LOG" | grep -E '^- (feat|fix|ui|perf|revert)(\(|:)' || true)
            if [ -n "$PLAYER_LOG" ]; then
              printf '%s\n' "$PLAYER_LOG" >> changelog.txt
            else
              echo "- Maintenance and internal improvements" >> changelog.txt
            fi
            printf "\n" >> changelog.txt
          done
          if [ ! -s changelog.txt ]; then
            echo "Release ${VERSION}" > changelog.txt
          fi

          API_VERSION=$(awk -F': *' '/^## APIVersion:/{print $2; exit}' RPQuest.txt | tr -d '\r' | awk '{print $NF}')
          COMPATIBILITY=""
          case "$API_VERSION" in
            101049) COMPATIBILITY="11.3.0" ;;
            101050) COMPATIBILITY="12.0.0" ;;
            101051) COMPATIBILITY="12.1.0" ;;
            *)
              echo "::warning::Unmapped APIVersion '${API_VERSION}' in RPQuest.txt; omitting compatibility parameter."
              ;;
          esac

          ENDPOINT="https://api.esoui.com/addons/update"
          if [ "$IS_DRY_RUN" = "true" ]; then
            ENDPOINT="https://api.esoui.com/addons/updatetest"
          fi

          CURL_ARGS=(
            --fail-with-body -sS -X POST "$ENDPOINT"
            -H "x-api-token: ${ESOUI_API_TOKEN}"
            -F "id=5080"
            -F "version=${VERSION}"
            -F "updatefile=@${ZIP_PATH}"
            -F "changelog=<changelog.txt"
            -F "description=<docs/esoui-description.bbcode"
          )
          if [ -n "$COMPATIBILITY" ]; then
            CURL_ARGS+=(-F "compatibility=${COMPATIBILITY}")
            echo "Publishing RPQuest v${VERSION} (${ZIP_PATH}, compatibility=${COMPATIBILITY}) to ${ENDPOINT}..."
          else
            echo "Publishing RPQuest v${VERSION} (${ZIP_PATH}) to ${ENDPOINT}..."
          fi

          curl "${CURL_ARGS[@]}"
