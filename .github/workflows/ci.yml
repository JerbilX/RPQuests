name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LuaJIT, Luacheck, and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks zip
          sudo luarocks install luacheck

      - name: Run unit tests
        run: luajit tests/run.lua

      - name: Run Luacheck
        run: luacheck .

      - name: Run ESOUI compliance checks
        run: ./scripts/check-esoui.sh --skip-package

      - name: Verify package build
        run: ./scripts/package.sh
